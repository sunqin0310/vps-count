<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VPS剩余价值计算器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6',
                        secondary: '#64748b',
                        accent: '#10b981',
                        profit: '#16a34a',
                        loss: '#dc2626',
                    },
                },
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .card-shadow { box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08); }
            .input-focus { @apply focus:outline-none; }
            .input-sm { @apply py-1.5 px-3 text-sm; }
            .result-number { @apply text-xl font-bold; }
            .no-spin::-webkit-outer-spin-button,
            .no-spin::-webkit-inner-spin-button {
                -webkit-appearance: none;
                margin: 0;
            }
            .no-spin { -moz-appearance: textfield; }
            /* 修复autofill输入框变黑的核心样式 */
            .autofill-fix:-webkit-autofill,
            .autofill-fix:-webkit-autofill:hover,
            .autofill-fix:-webkit-autofill:focus {
                -webkit-box-shadow: 0 0 0px 1000px white inset !important;
                box-shadow: 0 0 0px 1000px white inset !important;
                -webkit-text-fill-color: #111827 !important;
                border-color: #d1d5db !important;
                background-color: white !important;
                transition: background-color 5000s ease-in-out 0s;
            }
            .date-no-input { position: relative; }
            .date-no-input::before {
                content: '';
                position: absolute;
                top: 0;
                left: 0;
                right: 30px;
                bottom: 0;
                pointer-events: none;
            }
            .date-no-input::-webkit-calendar-picker-indicator,
            .date-no-input::-moz-calendar-picker-indicator {
                cursor: pointer;
                position: relative;
                z-index: 10;
            }
            .price-currency-group { @apply flex items-stretch w-full; }
            .price-input { @apply flex-1 rounded-r-none border-r-0; }
            .currency-select { @apply rounded-l-none border-l-0 py-1.5 px-2 text-sm; min-width: 90px; }
            /* 优化背景性能：移除fixed，改用min-height+cover */
            .bg-bing {
                background-size: cover;
                background-position: center;
                background-repeat: no-repeat;
                min-height: 100vh;
                /* 移除background-attachment: fixed，解决滚动卡顿 */
            }
            .bg-overlay {
                background-color: rgba(255, 255, 255, 0.85);
                min-height: 100vh;
                @apply md:bg-white/80;
            }
            /* 清除按钮样式 - 文字版+红色 */
            .clear-btn {
                @apply absolute top-2 right-2 px-3 py-1.5 rounded-lg hover:bg-primary/10 text-red-600 font-medium transition-colors cursor-pointer text-sm flex items-center gap-1;
            }
            .clear-btn.active {
                @apply bg-red-100 text-red-700;
            }
        }
    </style>
</head>
<body class="font-sans bg-bing" id="body-with-bg">
    <div class="bg-overlay">
        <div class="container mx-auto px-4 py-8 max-w-3xl">
            <div class="text-center mb-6">
                <h1 class="text-[clamp(1.8rem,4vw,2.5rem)] font-bold text-gray-800 mb-1">VPS剩余价值计算器</h1>
                <p class="text-gray-600 text-sm">精准计算你的VPS剩余使用时间和价值，评估出让收益</p>
            </div>

            <!-- 输入区域 -->
            <div class="bg-white rounded-xl p-4 card-shadow mb-6 backdrop-blur-sm bg-white/90 relative">
                <div id="clear-all-btn" class="clear-btn">
                    <i class="fas fa-trash-alt"></i>
                    <span>清空</span>
                </div>

                <div id="rate-status" class="mb-1 text-sm text-gray-500">
                    <i class="fas fa-circle-notch fa-spin mr-2"></i>正在获取实时汇率...
                </div>
                <p class="text-xs text-gray-400 mb-3"><span class="text-red-500">*</span> 必填项</p>
                <form id="vps-calculator-form" class="space-y-3">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-2">
                        <div>
                            <label for="vps-name" class="block text-sm font-medium text-gray-700 mb-1">VPS名称</label>
                            <input type="text" id="vps-name" class="w-full px-3 py-2 border border-gray-300 rounded-lg input-focus autofill-fix text-sm" placeholder="例如: 阿里云ECS-新加坡" autocomplete="off">
                        </div>
                        <div>
                            <label for="nq-link" class="block text-sm font-medium text-gray-700 mb-1">NQ链接</label>
                            <input type="url" id="nq-link" class="w-full px-3 py-2 border border-gray-300 rounded-lg input-focus autofill-fix text-sm" placeholder="例如: https://nodequality.com/" autocomplete="off">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-2">
                        <div>
                            <label for="purchase-amount" class="block text-sm font-medium text-gray-700 mb-1">购买价格/续费价格 <span class="text-red-500">*</span></label>
                            <div class="price-currency-group">
                                <input type="number" id="purchase-amount" min="0" step="0.01" required
                                       class="no-spin price-input input-sm border border-gray-300 rounded-lg input-focus text-sm" placeholder="例如: 100.00">
                                <select id="original-currency" class="currency-select border border-gray-300 rounded-lg text-gray-600 input-focus">
                                    <option value="USD">美元 USD</option>
                                    <option value="CNY">人民币 CNY</option>
                                    <option value="EUR">欧元 EUR</option>
                                    <option value="GBP">英镑 GBP</option>
                                    <option value="JPY">日元 JPY</option>
                                    <option value="HKD">港币 HKD</option>
                                    <option value="SGD">新加坡元 SGD</option>
                                    <option value="KRW">韩元 KRW</option>
                                </select>
                            </div>
                        </div>
                        <div>
                            <label for="transfer-amount" class="block text-sm font-medium text-gray-700 mb-1">
                                出让/溢价
                                <span class="inline-flex items-center ml-2">
                                    <label class="flex items-center text-sm cursor-pointer mr-3">
                                        <input type="radio" name="transfer-mode" value="transfer" class="mr-1" checked> 出让
                                    </label>
                                    <label class="flex items-center text-sm cursor-pointer">
                                        <input type="radio" name="transfer-mode" value="premium" class="mr-1"> 溢价
                                    </label>
                                </span>
                            </label>
                            <div class="price-currency-group">
                                <input type="number" id="transfer-amount" min="0" step="0.01"
                                       class="no-spin price-input input-sm border border-gray-300 rounded-lg input-focus text-sm" placeholder="请输入出让价格">
                                <select id="target-currency" class="currency-select border border-gray-300 rounded-lg text-gray-600 input-focus">
                                    <option value="CNY">人民币 CNY</option>
                                    <option value="USD">美元 USD</option>
                                    <option value="EUR">欧元 EUR</option>
                                    <option value="GBP">英镑 GBP</option>
                                    <option value="JPY">日元 JPY</option>
                                    <option value="HKD">港币 HKD</option>
                                    <option value="SGD">新加坡元 SGD</option>
                                    <option value="KRW">韩元 KRW</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">续费周期 <span class="text-red-500">*</span></label>
                        <div class="grid grid-cols-3 sm:grid-cols-6 gap-1.5">
                            <label class="flex items-center justify-center p-2 border border-gray-300 rounded-lg cursor-pointer hover:bg-gray-50 transition text-sm">
                                <input type="radio" name="billing-cycle" value="monthly" class="mr-1"> <span>月付</span>
                            </label>
                            <label class="flex items-center justify-center p-2 border border-gray-300 rounded-lg cursor-pointer hover:bg-gray-50 transition text-sm">
                                <input type="radio" name="billing-cycle" value="quarterly" class="mr-1"> <span>季付</span>
                            </label>
                            <label class="flex items-center justify-center p-2 border border-gray-300 rounded-lg cursor-pointer hover:bg-gray-50 transition text-sm">
                                <input type="radio" name="billing-cycle" value="biannually" class="mr-1"> <span>半年付</span>
                            </label>
                            <label class="flex items-center justify-center p-2 border border-gray-300 rounded-lg cursor-pointer hover:bg-gray-50 transition text-sm">
                                <input type="radio" name="billing-cycle" value="yearly" class="mr-1" checked> <span>年付</span>
                            </label>
                            <label class="flex items-center justify-center p-2 border border-gray-300 rounded-lg cursor-pointer hover:bg-gray-50 transition text-sm">
                                <input type="radio" name="billing-cycle" value="twoyears" class="mr-1"> <span>两年付</span>
                            </label>
                            <label class="flex items-center justify-center p-2 border border-gray-300 rounded-lg cursor-pointer hover:bg-gray-50 transition text-sm">
                                <input type="radio" name="billing-cycle" value="threeyears" class="mr-1"> <span>三年付</span>
                            </label>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-2">
                        <div>
                            <label for="purchase-date" class="block text-sm font-medium text-gray-700 mb-1">购买日期 <span class="text-red-500">*</span></label>
                            <input type="date" id="purchase-date" required
                                   class="w-full px-3 py-2 border border-gray-300 rounded-lg input-focus text-sm date-no-input">
                        </div>
                        <div>
                            <label for="expiry-date" class="block text-sm font-medium text-gray-700 mb-1">到期日期 <span class="text-gray-400 text-xs">(自动计算)</span></label>
                            <input type="date" id="expiry-date" readonly class="w-full px-3 py-2 border border-gray-300 rounded-lg bg-gray-50 text-gray-700 text-sm input-focus">
                        </div>
                    </div>

                    <button type="submit" class="w-full bg-primary hover:bg-primary/90 text-white font-medium py-2 px-4 rounded-lg transition flex items-center justify-center text-sm">
                        <i class="fas fa-calculator mr-2"></i>计算剩余价值
                    </button>
                </form>
            </div>

            <div id="result-section" class="bg-white rounded-xl p-4 card-shadow hidden backdrop-blur-sm bg-white/90">
                <div class="flex justify-between items-center mb-3">
                    <h2 class="text-xl font-semibold text-gray-800">计算结果</h2>
                    <div class="flex items-center gap-2">
                        <button id="preview-md-btn" class="text-xs text-gray-500 hover:text-primary cursor-pointer">点击预览表格</button>
                        <button id="copy-md-btn" class="px-3 py-1.5 bg-primary text-white rounded-lg text-sm hover:bg-primary/90 flex items-center">
                            <i class="fas fa-copy mr-1"></i><span>复制MD表格</span>
                        </button>
                    </div>
                </div>

                <div id="vps-name-result" class="mb-3 text-2xl font-bold text-gray-700 text-center hidden"></div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-3">
                    <div class="p-3 bg-gray-50 rounded-lg">
                        <p class="text-sm text-gray-600 mb-1 flex items-center">
                            <i class="fas fa-wallet mr-2 text-primary"></i>购买价格/续费价格
                        </p>
                        <p id="purchase-price" class="result-number text-primary">--</p>
                    </div>
                    <div class="p-3 bg-gray-50 rounded-lg">
                        <p class="text-sm text-gray-600 mb-1 flex items-center">
                            <i class="fas fa-calendar mr-2 text-primary"></i>起止时间
                        </p>
                        <p id="usage-cycle" class="result-number text-primary whitespace-nowrap">--</p>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-3">
                    <div class="p-3 bg-gray-50 rounded-lg">
                        <p class="text-sm text-gray-500 mb-1">剩余时间</p>
                        <p id="remaining-time" class="result-number text-primary">--</p>
                    </div>
                    <div class="p-3 bg-gray-50 rounded-lg">
                        <p class="text-sm text-gray-500 mb-1">剩余价值</p>
                        <p id="remaining-value-target" class="result-number text-accent">--</p>
                    </div>
                </div>

                <div id="transfer-section" class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-3 hidden">
                    <div class="p-3 bg-gray-50 rounded-lg">
                        <p class="text-sm text-gray-500 mb-1">出让价格</p>
                        <p id="transfer-price" class="result-number text-primary">--</p>
                    </div>
                    <div class="p-3 bg-gray-50 rounded-lg">
                        <p class="text-sm text-gray-500 mb-1">溢价/亏损</p>
                        <p id="profit-loss" class="result-number">--</p>
                    </div>
                </div>

                <div class="text-sm text-gray-500 pt-2 border-t border-gray-100 text-center">
                    <p>实时汇率: 1 <span id="rate-from">USD</span> = <span id="rate-value">--</span> <span id="rate-to">CNY</span> (更新时间: <span id="rate-update-time">--</span>)</p>
                    <p class="mt-1">计算生成时间: <span id="calculate-time">--</span></p>
                </div>
            </div>

            <!-- MD表格预览弹窗 -->
            <div id="md-modal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
                <div class="bg-white rounded-t-2xl sm:rounded-2xl w-full sm:max-w-lg max-h-[80vh] overflow-hidden flex flex-col">
                    <div class="px-4 py-3 border-b">
                        <h3 class="font-semibold text-gray-800">MD表格预览</h3>
                    </div>
                    <div class="p-4 overflow-auto flex-1">
                        <table id="md-preview-table" class="w-full border-collapse text-sm">
                            <tbody>
                                <tr id="md-row-title"><td class="border border-gray-300 px-2 py-1 font-bold" colspan="2">--</td></tr>
                                <tr id="md-row-purchase"><td class="border border-gray-300 px-2 py-1 text-gray-600">购买/续费价格</td><td class="border border-gray-300 px-2 py-1" id="md-purchase">--</td></tr>
                                <tr id="md-row-cycle"><td class="border border-gray-300 px-2 py-1 text-gray-600">起止时间</td><td class="border border-gray-300 px-2 py-1" id="md-cycle">--</td></tr>
                                <tr id="md-row-remain"><td class="border border-gray-300 px-2 py-1 text-gray-600">剩余时间</td><td class="border border-gray-300 px-2 py-1" id="md-remain">--</td></tr>
                                <tr id="md-row-value"><td class="border border-gray-300 px-2 py-1 text-gray-600">剩余价值</td><td class="border border-gray-300 px-2 py-1 font-bold" id="md-value">--</td></tr>
                                <tr id="md-row-transfer" class="hidden"><td class="border border-gray-300 px-2 py-1 text-gray-600">出让价格</td><td class="border border-gray-300 px-2 py-1" id="md-transfer">--</td></tr>
                                <tr id="md-row-profit" class="hidden"><td class="border border-gray-300 px-2 py-1 text-gray-600">溢价/亏损</td><td class="border border-gray-300 px-2 py-1 font-bold" id="md-profit">--</td></tr>
                                <tr><td class="border border-gray-300 px-2 py-1 text-gray-600">实时汇率</td><td class="border border-gray-300 px-2 py-1" id="md-rate">--</td></tr>
                                <tr><td class="border border-gray-300 px-2 py-1 text-gray-600">汇率更新</td><td class="border border-gray-300 px-2 py-1" id="md-rate-time">--</td></tr>
                                <tr><td class="border border-gray-300 px-2 py-1 text-gray-600">计算时间</td><td class="border border-gray-300 px-2 py-1" id="md-calc-time">--</td></tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="px-4 py-3 border-t flex gap-2">
                        <button id="modal-copy-btn" class="flex-1 bg-primary text-white py-2 rounded-lg text-sm hover:bg-primary/90 flex items-center justify-center">
                            <i class="fas fa-copy mr-1"></i>复制MD表格
                        </button>
                        <button id="modal-close-btn" class="flex-1 bg-gray-200 text-gray-700 py-2 rounded-lg text-sm hover:bg-gray-300">关闭</button>
                    </div>
                </div>
            </div>

            <!-- GitHub链接 -->
            <div class="mt-8 text-center text-sm text-gray-600">
                <p>
                    <i class="fab fa-github mr-1"></i>
                    源码仓库：<a href="https://github.com/sunqin0310/vps-count" target="_blank" class="text-primary hover:underline">github.com/sunqin0310/vps-count</a>
                </p>
            </div>
        </div>
    </div>

    <script>
        let exchangeRates = {};
        let rateUpdateTime = '';
        let hasCalculated = false;
        const API_BASE_URL = 'https://huilv.007677.xyz/';
        const BING_BG = {
            pc: 'https://bing.img.run/rand_uhd.php',
            mobile: 'https://bing.img.run/rand_m.php'
        };
        const MOBILE_BREAKPOINT = 768;
        let currentBgUrl = '';

        document.addEventListener('DOMContentLoaded', function () {
            loadResponsiveBingBg();
            window.addEventListener('resize', debounce(loadResponsiveBingBg, 500));

            const now = new Date();
            const today = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
            document.getElementById('purchase-date').value = today;
            document.getElementById('purchase-date').max = today;
            fetchExchangeRates();
            calculateExpiryDate();

            const purchaseDateInput = document.getElementById('purchase-date');
            purchaseDateInput.addEventListener('paste', e => e.preventDefault());

            const priceInputs = document.querySelectorAll('input[type="number"].price-input');
            priceInputs.forEach(input => {
                input.addEventListener('wheel', e => {
                    e.preventDefault();
                    input.blur(); input.focus();
                }, { passive: false });
            });

            document.getElementById('purchase-date').addEventListener('change', calculateExpiryDate);
            document.querySelectorAll('input[name="billing-cycle"]').forEach(radio => {
                radio.addEventListener('change', calculateExpiryDate);
            });
            document.getElementById('original-currency').addEventListener('change', fetchExchangeRates);
            document.getElementById('target-currency').addEventListener('change', fetchExchangeRates);
            document.getElementById('vps-calculator-form').addEventListener('submit', e => {
                e.preventDefault();
                calculateVPSValue();
            });

            document.getElementById('copy-md-btn').addEventListener('click', copyResultAsMarkdownTable);
            document.getElementById('clear-all-btn').addEventListener('click', clearAllContent);

            // 弹窗预览
            document.getElementById('preview-md-btn').addEventListener('click', showMdPreview);
            document.getElementById('modal-close-btn').addEventListener('click', hideMdPreview);
            document.getElementById('modal-copy-btn').addEventListener('click', function() {
                copyResultAsMarkdownTable();
                const btn = this;
                const old = btn.innerHTML;
                btn.innerHTML = '<i class="fas fa-check mr-1"></i>已复制';
                btn.disabled = true;
                setTimeout(() => {
                    hideMdPreview();
                    btn.innerHTML = old;
                    btn.disabled = false;
                }, 1000);
            });
            document.getElementById('md-modal').addEventListener('click', function(e) {
                if (e.target === this) hideMdPreview();
            });

            // 出让/溢价模式切换
            document.querySelectorAll('input[name="transfer-mode"]').forEach(radio => {
                radio.addEventListener('change', function() {
                    const transferInput = document.getElementById('transfer-amount');
                    transferInput.placeholder = this.value === 'transfer' ? '请输入出让价格' : '请输入溢价金额';
                    transferInput.value = '';
                });
            });

            // 输入变化提醒重新计算
            const allInputs = document.querySelectorAll('#vps-calculator-form input, #vps-calculator-form select');
            allInputs.forEach(input => {
                input.addEventListener('input', checkRecalculate);
                input.addEventListener('change', checkRecalculate);
            });
        });

        function checkRecalculate() {
            if (!hasCalculated) return;
            hasCalculated = false;
            const resultSection = document.getElementById('result-section');
            resultSection.classList.add('opacity-50');
            showToast('输入已更改，请重新计算');
        }

        function showToast(msg) {
            let toast = document.getElementById('recalc-toast');
            if (!toast) {
                toast = document.createElement('div');
                toast.id = 'recalc-toast';
                toast.className = 'fixed top-4 left-1/2 -translate-x-1/2 bg-yellow-500 text-white px-4 py-2 rounded-lg shadow-lg z-50 transition-opacity';
                document.body.appendChild(toast);
            }
            toast.textContent = msg;
            toast.style.opacity = '1';
            setTimeout(() => { toast.style.opacity = '0'; }, 2000);
        }

        function updateMdPreview() {
            const vpsName = document.getElementById('vps-name').value.trim() || 'VPS 剩余价值信息';
            const nqLink = document.getElementById('nq-link').value.trim();
            const nqHtml = nqLink ? ` <a href="${nqLink}" target="_blank" class="text-primary underline">NQ</a>` : '';
            const titleHtml = `<td class="border border-gray-300 px-2 py-1 font-bold" colspan="2"><a href="https://vps.007677.xyz" target="_blank" class="text-primary">📌VPS计算器</a> ${vpsName}${nqHtml}</td>`;
            document.getElementById('md-row-title').innerHTML = titleHtml;
            document.getElementById('md-purchase').textContent = document.getElementById('purchase-price').textContent;
            document.getElementById('md-cycle').textContent = document.getElementById('usage-cycle').textContent;
            document.getElementById('md-remain').textContent = document.getElementById('remaining-time').textContent;
            document.getElementById('md-value').textContent = document.getElementById('remaining-value-target').textContent;
            document.getElementById('md-rate').textContent = `1 ${document.getElementById('rate-from').textContent} = ${document.getElementById('rate-value').textContent} ${document.getElementById('rate-to').textContent}`;
            document.getElementById('md-rate-time').textContent = document.getElementById('rate-update-time').textContent;
            document.getElementById('md-calc-time').textContent = document.getElementById('calculate-time').textContent;

            const hasTransfer = !document.getElementById('transfer-section').classList.contains('hidden');
            if (hasTransfer) {
                document.getElementById('md-transfer').textContent = document.getElementById('transfer-price').textContent;
                document.getElementById('md-profit').textContent = document.getElementById('profit-loss').textContent;
                document.getElementById('md-profit').className = document.getElementById('profit-loss').className;
                document.getElementById('md-row-transfer').classList.remove('hidden');
                document.getElementById('md-row-profit').classList.remove('hidden');
            } else {
                document.getElementById('md-row-transfer').classList.add('hidden');
                document.getElementById('md-row-profit').classList.add('hidden');
            }
        }

        function showMdPreview() {
            updateMdPreview();
            document.getElementById('md-modal').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function hideMdPreview() {
            document.getElementById('md-modal').classList.add('hidden');
            document.body.style.overflow = '';
        }

        // 一键清除所有内容
        function clearAllContent() {
            // 清空输入框
            document.getElementById('vps-name').value = '';
            document.getElementById('nq-link').value = '';
            document.getElementById('purchase-amount').value = '';
            document.getElementById('transfer-amount').value = '';
            
            // 重置日期
            const now = new Date();
            const today = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
            document.getElementById('purchase-date').value = today;

            // 重置续费周期和货币
            document.querySelector('input[name="billing-cycle"][value="yearly"]').checked = true;
            document.querySelector('input[name="transfer-mode"][value="transfer"]').checked = true;
            document.getElementById('original-currency').value = 'USD';
            document.getElementById('target-currency').value = 'CNY';
            calculateExpiryDate();
            
            // 清空结果
            document.getElementById('vps-name-result').classList.add('hidden');
            document.getElementById('purchase-price').textContent = '--';
            document.getElementById('usage-cycle').textContent = '--';
            document.getElementById('remaining-time').textContent = '--';
            document.getElementById('remaining-value-target').textContent = '--';
            document.getElementById('transfer-price').textContent = '--';
            document.getElementById('profit-loss').textContent = '--';
            document.getElementById('profit-loss').className = 'result-number';
            document.getElementById('rate-from').textContent = 'USD';
            document.getElementById('rate-to').textContent = 'CNY';
            document.getElementById('rate-value').textContent = '--';
            document.getElementById('rate-update-time').textContent = '--';
            document.getElementById('calculate-time').textContent = '--';

            // 重置MD预览
            document.getElementById('md-row-title').innerHTML = '<td class="border border-gray-300 px-2 py-1 font-bold" colspan="2">--</td>';
            document.getElementById('md-purchase').textContent = '--';
            document.getElementById('md-cycle').textContent = '--';
            document.getElementById('md-remain').textContent = '--';
            document.getElementById('md-value').textContent = '--';
            document.getElementById('md-rate').textContent = '--';
            document.getElementById('md-rate-time').textContent = '--';
            document.getElementById('md-calc-time').textContent = '--';
            document.getElementById('md-row-transfer').classList.add('hidden');
            document.getElementById('md-row-profit').classList.add('hidden');

            // 隐藏结果区域
            document.getElementById('result-section').classList.add('hidden');
            document.getElementById('transfer-section').classList.add('hidden');
            hasCalculated = false;

            // 重新获取汇率
            fetchExchangeRates();
            
            // 视觉反馈
            const clearBtn = document.getElementById('clear-all-btn');
            clearBtn.classList.add('active');
            setTimeout(() => {
                clearBtn.classList.remove('active');
            }, 500);
            
            // 聚焦输入框
            document.getElementById('vps-name').focus();
        }

        // 防抖函数
        function debounce(fn, delay) {
            let timer;
            return (...args) => {
                clearTimeout(timer);
                timer = setTimeout(() => fn(...args), delay);
            };
        }

        // 加载背景图（优化性能）
        function loadResponsiveBingBg() {
            const isMobile = window.innerWidth <= MOBILE_BREAKPOINT;
            const targetBgUrl = isMobile ? BING_BG.mobile : BING_BG.pc;
            if (targetBgUrl === currentBgUrl) return;
            currentBgUrl = targetBgUrl;
            const img = new Image();
            img.src = targetBgUrl;
            img.onload = () => {
                document.getElementById('body-with-bg').style.backgroundImage = `url(${targetBgUrl})`;
            };
            img.onerror = () => {
                document.getElementById('body-with-bg').style.background = '#f9fafb';
            };
        }

        // 格式化日期时间
        function formatDateTime(date) {
            const y = date.getFullYear();
            const m = String(date.getMonth()+1).padStart(2,'0');
            const d = String(date.getDate()).padStart(2,'0');
            const h = String(date.getHours()).padStart(2,'0');
            const i = String(date.getMinutes()).padStart(2,'0');
            const s = String(date.getSeconds()).padStart(2,'0');
            return `${y}/${m}/${d} ${h}:${i}:${s}`;
        }

        // 获取汇率
        async function fetchExchangeRates() {
            const statusEl = document.getElementById('rate-status');
            try {
                const res = await fetch(API_BASE_URL);
                const data = await res.json();
                const usdRates = data.rates;
                exchangeRates = { USD: usdRates };
                for (const cur in usdRates) {
                    if (cur === 'USD') continue;
                    exchangeRates[cur] = {};
                    for (const target in usdRates) {
                        exchangeRates[cur][target] = usdRates[target] / usdRates[cur];
                    }
                }
                rateUpdateTime = data.updated_at;
                const from = document.getElementById('original-currency').value;
                const to = document.getElementById('target-currency').value;
                const rate = exchangeRates[from]?.[to];
                statusEl.innerHTML = `<i class="fas fa-check-circle mr-2 text-green-500"></i>实时汇率已更新 (1 ${from} = ${rate?.toFixed(4)} ${to})`;
            } catch (e) {
                console.error(e);
                statusEl.innerHTML = '<i class="fas fa-exclamation-circle mr-2 text-red-500"></i>获取汇率失败，请刷新重试';
            }
        }

        // 计算到期日期
        function calculateExpiryDate() {
            const p = document.getElementById('purchase-date').value;
            if (!p) return;
            const [year, month, day] = p.split('-').map(Number);
            const cycle = document.querySelector('input[name="billing-cycle"]:checked').value;
            let newYear = year, newMonth = month, newDay = day;
            switch(cycle){
                case 'monthly': newMonth += 1; break;
                case 'quarterly': newMonth += 3; break;
                case 'biannually': newMonth += 6; break;
                case 'yearly': newYear += 1; break;
                case 'twoyears': newYear += 2; break;
                case 'threeyears': newYear += 3; break;
            }
            // 处理月份溢出
            while (newMonth > 12) { newMonth -= 12; newYear += 1; }
            // 处理日期溢出（如1月31日+1月=2月28日）
            const lastDay = new Date(newYear, newMonth, 0).getDate();
            newDay = Math.min(newDay, lastDay);
            document.getElementById('expiry-date').value = `${newYear}-${String(newMonth).padStart(2,'0')}-${String(newDay).padStart(2,'0')}`;
        }

        // 格式化日期
        function formatDate(s){
            if(!s) return '--';
            const [y, m, d] = s.split('-').map(Number);
            return `${y}/${String(m).padStart(2,'0')}/${String(d).padStart(2,'0')}`;
        }

        // 格式化货币
        function formatCurrency(amt,cur){
            const sym = { USD:'$', CNY:'¥', EUR:'€', GBP:'£', JPY:'¥', HKD:'HK$', SGD:'S$', KRW:'₩' };
            return `${sym[cur]||cur} ${amt.toFixed((cur==='JPY'||cur==='KRW')?0:2)}`;
        }

        // 获取周期文本
        function getCycleText(){
            const v = document.querySelector('input[name="billing-cycle"]:checked').value;
            const map = {monthly:'月付', quarterly:'季付', biannually:'半年付', yearly:'年付', twoyears:'两年付', threeyears:'三年付'};
            return map[v]||v;
        }

        // 核心计算函数（优化滚动）
        function calculateVPSValue(){
            const vpsName = document.getElementById('vps-name').value.trim();
            const oriCur = document.getElementById('original-currency').value;
            const tarCur = document.getElementById('target-currency').value;
            const purchaseAmt = parseFloat(document.getElementById('purchase-amount').value);
            const transferAmt = parseFloat(document.getElementById('transfer-amount').value)||0;
            const pDate = document.getElementById('purchase-date').value;
            const eDate = document.getElementById('expiry-date').value;

            if(isNaN(purchaseAmt) || purchaseAmt<=0){
                alert('请输入有效购买金额');
                return;
            }

            const rate = exchangeRates[oriCur]?.[tarCur];
            if(!rate){
                alert('汇率未加载，请稍后重试');
                return;
            }

            // 用整天计算
            const parseLocal = s => { const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); };
            const p = parseLocal(pDate);
            const e = parseLocal(eDate);
            const today = new Date(); today.setHours(0,0,0,0);
            const totalDays = Math.round((e - p) / 86400000);
            const remainDays = Math.max(Math.round((e - today) / 86400000), 0);
            const ratio = totalDays > 0 ? remainDays / totalDays : 0;
            const remainVal = purchaseAmt * ratio;
            const remainValTar = remainVal * rate;

            // 填充计算结果
            const purchasePriceText = `${formatCurrency(purchaseAmt,oriCur)}（${getCycleText()}）`;
            const usageCycleText = `${formatDate(pDate)} - ${formatDate(eDate)}`;
            const remainTimeText = `${remainDays} 天`;
            const remainValueText = formatCurrency(remainValTar,tarCur);

            document.getElementById('purchase-price').textContent = purchasePriceText;
            document.getElementById('usage-cycle').textContent = usageCycleText;
            document.getElementById('remaining-time').textContent = remainTimeText;
            document.getElementById('remaining-value-target').textContent = remainValueText;

            // VPS名称显示
            const vpsEl = document.getElementById('vps-name-result');
            if(vpsName){
                vpsEl.textContent = `📌 ${vpsName}`;
                vpsEl.classList.remove('hidden');
            }else{
                vpsEl.classList.add('hidden');
            }

            // 转让价格相关
            const transferSection = document.getElementById('transfer-section');
            const transferMode = document.querySelector('input[name="transfer-mode"]:checked');
            if(transferAmt>0 && transferMode){
                const mode = transferMode.value;
                let transferPrice, premiumAmount;

                if(mode === 'transfer'){
                    transferPrice = transferAmt;
                    premiumAmount = transferAmt - remainValTar;
                }else{
                    premiumAmount = transferAmt;
                    transferPrice = remainValTar + premiumAmount;
                }

                document.getElementById('transfer-price').textContent = formatCurrency(transferPrice, tarCur);
                const diffStr = formatCurrency(Math.abs(premiumAmount), tarCur);
                const profitCls = premiumAmount>0 ? 'text-profit' : premiumAmount<0 ? 'text-loss' : 'text-secondary';
                const profitTxt = premiumAmount>0 ? `+${diffStr}（溢价）` : premiumAmount<0 ? `-${diffStr}（亏损）` : `${diffStr}（持平）`;
                const plEl = document.getElementById('profit-loss');
                plEl.textContent = profitTxt;
                plEl.className = `result-number ${profitCls}`;
                transferSection.classList.remove('hidden');
            }else{
                transferSection.classList.add('hidden');
            }

            // 汇率信息
            document.getElementById('rate-from').textContent = oriCur;
            document.getElementById('rate-to').textContent = tarCur;
            document.getElementById('rate-value').textContent = rate.toFixed(4);
            document.getElementById('rate-update-time').textContent = rateUpdateTime;
            document.getElementById('calculate-time').textContent = formatDateTime(new Date());

            // 显示结果区域
            document.getElementById('result-section').classList.remove('hidden');
            document.getElementById('result-section').classList.remove('opacity-50');
            hasCalculated = true;
            // 替换卡顿的 smooth scroll 为普通定位
            const resultSection = document.getElementById('result-section');
            const rect = resultSection.getBoundingClientRect();
            window.scrollTo({
                top: window.scrollY + rect.top - 20, // 保留20px间距
                behavior: 'auto' // 禁用平滑滚动，解决卡顿
            });
        }

        // 复制MD表格
        function copyResultAsMarkdownTable() {
            const vpsName = document.getElementById('vps-name').value.trim() || 'VPS 剩余价值信息';
            const nqLink = document.getElementById('nq-link').value.trim();
            const purchasePrice = document.getElementById('purchase-price').textContent;
            const usageCycle = document.getElementById('usage-cycle').textContent;
            const remainTime = document.getElementById('remaining-time').textContent;
            const remainValue = document.getElementById('remaining-value-target').textContent;

            const hasTransfer = !document.getElementById('transfer-section').classList.contains('hidden');
            const transferPrice = hasTransfer ? document.getElementById('transfer-price').textContent : '';
            const profitLoss = hasTransfer ? document.getElementById('profit-loss').textContent : '';

            const rateFrom = document.getElementById('rate-from').textContent;
            const rateTo = document.getElementById('rate-to').textContent;
            const rateValue = document.getElementById('rate-value').textContent;
            const rateUpdateTimeText = document.getElementById('rate-update-time').textContent;
            const calculateTime = document.getElementById('calculate-time').textContent;

            const nqText = nqLink ? ` [NQ](${nqLink})` : '';
            let md = `| [📌VPS计算器](https://vps.007677.xyz) | **${vpsName}**${nqText} |\n`;
            md += `|----|----------|\n`;
            md += `| 购买/续费价格 | ${purchasePrice} |\n`;
            md += `| 起止时间 | ${usageCycle} |\n`;
            md += `| 剩余时间 | ${remainTime} |\n`;
            md += `| 剩余价值 | **${remainValue}** |\n`;

            if (hasTransfer) {
                md += `| 出让价格 | ${transferPrice} |\n`;
                md += `| 溢价/亏损 | **${profitLoss}** |\n`;
            }

            md += `| 实时汇率 | 1 ${rateFrom} = ${rateValue} ${rateTo} |\n`;
            md += `| 汇率更新 | ${rateUpdateTimeText} |\n`;
            md += `| 计算时间 | ${calculateTime} |`;

            navigator.clipboard.writeText(md).then(() => {
                const btn = document.getElementById('copy-md-btn');
                const old = btn.innerHTML;
                btn.innerHTML = '<i class="fas fa-check mr-1"></i>已复制';
                setTimeout(() => btn.innerHTML = old, 1500);
            }).catch(() => {
                alert('复制失败，请手动复制');
            });
        }
    </script>
